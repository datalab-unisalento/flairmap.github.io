[project]
name = "flair-mcp"
version = "0.1.0"
description = "FLAIR MCP Server"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.0.0",
    "diskcache>=5.6.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=1.0.0",
    "redis",
    "pydevd_pycharm",
    "pandas",
    "cache>=1.0.3",
    "duckdb>=1.5.5",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "selenium>=4.49.0",
    "webdriver-manager>=4.1.2",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
]

[project.scripts]
flair-mcp = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
